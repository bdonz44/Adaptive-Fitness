# Compiles the iPhone app for the simulator (no signing, no upload) so Swift
# errors show up without needing the Mac.
name: App build

# Manual only (Actions tab -> Run workflow). Automatic runs were turned off on Nov 24:
# GitHub's free Mac minutes run out after a few pushes a month. Builds now come from
# Xcode Cloud (free with the Apple Developer membership) or scripts/upload-testflight.sh.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project Hybrid12.xcodeproj \
            -scheme Hybrid12 \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
