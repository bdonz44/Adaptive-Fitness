name: Engine tests

# Automatic again (Nov 27): the repo is public, so GitHub's Mac runners are free.
# Xcode Cloud and scripts/upload-testflight.sh remain as backups.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build and test the Engine
        run: swift test
