# Builds the iPhone app on a GitHub-hosted Mac and uploads it to TestFlight.
# Runs on every push to main (notes-only changes skipped), or by hand from the
# Actions tab ("TestFlight" -> Run workflow). No Mac of your own needed.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect API issuer ID
#   ASC_KEY_P8      Full contents of the AuthKey_XXXX.p8 file
# Optional (defaults shown): APPLE_TEAM_ID secret (9AY7PD87RL),
#   IOS_BUNDLE_ID variable (com.bdonz44.hybrid12; the Live Activity extension
#   is that plus ".widgets").

name: TestFlight

# Automatic again (Nov 27): the repo is public, so GitHub's Mac runners are free.
# Xcode Cloud and scripts/upload-testflight.sh remain as backups.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    # App Store Connect only accepts builds from a current Xcode/SDK.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '9AY7PD87RL' }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.bdonz44.hybrid12' }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Check setup
        run: |
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Engine tests
        run: swift test

      - name: WHOOP keys
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
        run: |
          # Repository secrets WHOOP_CLIENT_ID / WHOOP_CLIENT_SECRET; without them WHOOP is off in this build.
          if [ -n "$WHOOP_CLIENT_ID" ] && [ -n "$WHOOP_CLIENT_SECRET" ]; then
            printf 'WHOOP_CLIENT_ID = %s\nWHOOP_CLIENT_SECRET = %s\n' "$WHOOP_CLIENT_ID" "$WHOOP_CLIENT_SECRET" > Config/Secrets.xcconfig
            echo "WHOOP keys added."
          else
            echo "::warning::No WHOOP secrets: this build has WHOOP turned off."
          fi

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          # Timestamp build numbers always increase.
          build=$(TZ=America/Chicago date +%Y%m%d.%H%M)
          echo "BUILD=$build" >> "$GITHUB_ENV"
          # Archive unsigned; the export step signs with Apple's cloud-managed
          # distribution certificate (signing here creates a new development
          # certificate on every fresh runner until Apple's limit is hit).
          xcodebuild archive \
            -project Hybrid12.xcodeproj \
            -scheme Hybrid12 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Hybrid12.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            APP_BUNDLE_ID="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Keep iCloud entitlements
        run: |
          # The unsigned archive carries no entitlements, so export would sign
          # without iCloud. An ad-hoc signature stores them for export to keep.
          # The widget extension inside is signed first (an app can't be signed
          # around unsigned code).
          app="$RUNNER_TEMP/Hybrid12.xcarchive/Products/Applications/Hybrid12.app"
          codesign --force --sign - --timestamp=none \
            --entitlements Hybrid12Widgets/Hybrid12Widgets.entitlements "$app/PlugIns/Hybrid12Widgets.appex"
          codesign --force --sign - --timestamp=none \
            --entitlements App/Hybrid12.entitlements "$app"

      - name: Upload to TestFlight
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Hybrid12.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded build $BUILD. It appears in TestFlight after processing (about 10-30 minutes)."

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
