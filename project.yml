# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen   (once)
#   xcodegen generate
# then open Hybrid12.xcodeproj. The .xcodeproj is not committed.
name: Hybrid12
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # The widget extension's bundle ID is built from this, so CI overrides
    # APP_BUNDLE_ID rather than PRODUCT_BUNDLE_IDENTIFIER.
    APP_BUNDLE_ID: com.bdonz44.hybrid12
    DEVELOPMENT_TEAM: 9AY7PD87RL
packages:
  Hybrid12Engine:
    path: .
targets:
  Hybrid12:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Data
      - path: Features
      - path: Services
      - path: Shared
    dependencies:
      - package: Hybrid12Engine
      - target: Hybrid12Widgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hybrid 12
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
        WhoopClientID: $(WHOOP_CLIENT_ID)
        WhoopClientSecret: $(WHOOP_CLIENT_SECRET)
        NSHealthShareUsageDescription: Hybrid 12 reads your workouts, sleep and heart rate to count cardio and suggest how hard to train.
        NSHealthUpdateUsageDescription: Hybrid 12 saves each finished session to Health as a workout so it shows in the Fitness app.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    entitlements:
      path: App/Hybrid12.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.bdonz44.hybrid12]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The six look icons (AppIcon-Iron ...) become alternate icons.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme: {}
  Hybrid12Widgets:
    # Rest timer Live Activity (Lock Screen and Dynamic Island).
    type: app-extension
    platform: iOS
    sources:
      - path: Hybrid12Widgets
      - path: Shared
    info:
      path: Hybrid12Widgets/Info.plist
      properties:
        CFBundleDisplayName: Hybrid 12
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
