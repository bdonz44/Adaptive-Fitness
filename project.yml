# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen   (once)
#   xcodegen generate
# then open Hybrid12.xcodeproj. The .xcodeproj is not committed.
name: Hybrid12
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
packages:
  Hybrid12Engine:
    path: .
targets:
  Hybrid12:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Data
      - path: Features
      - path: Services
    dependencies:
      - package: Hybrid12Engine
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hybrid 12
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bdonz44.hybrid12
        DEVELOPMENT_TEAM: 9AY7PD87RL
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    scheme: {}
